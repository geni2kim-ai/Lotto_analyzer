name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Configure placeholder Google Services
        run: cp app/google-services.json.example app/google-services.json

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test Kotlin interpolation checker
        run: python3 -m unittest tools.test_check_kotlin_interpolation

      - name: Check Kotlin interpolation convention
        run: python3 tools/check_kotlin_interpolation.py

      - name: Verify Fragment dependency resolution
        run: |
          fragment_version="$(sed -n 's/^androidxFragmentVersion=//p' gradle.properties)"
          test -n "$fragment_version"
          ./gradlew --no-daemon :app:dependencyInsight --dependency androidx.fragment:fragment --configuration debugRuntimeClasspath | tee fragment-dependency-insight.txt
          grep -Fq "androidx.fragment:fragment:$fragment_version" fragment-dependency-insight.txt
          grep -Fq "androidx.fragment:fragment:1.1.0 -> $fragment_version" fragment-dependency-insight.txt

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Run debug unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Emit U1 FlowRow screenshot evidence
        run: |
          screenshot="feature/ui/build/reports/analysis-status-chips/u1-359dp-2x.png"
          test -s "$screenshot"
          echo "U1 screenshot: $screenshot"
          echo "U1_SCREENSHOT_BASE64=$(base64 -w0 "$screenshot")"

      - name: Upload U1 FlowRow screenshot
        uses: actions/upload-artifact@v4
        with:
          name: analysis-status-chips-u1
          path: feature/ui/build/reports/analysis-status-chips/u1-359dp-2x.png
          if-no-files-found: error
