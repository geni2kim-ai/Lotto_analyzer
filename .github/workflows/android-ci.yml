name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Configure placeholder Google Services
        run: cp app/google-services.json.example app/google-services.json

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Run debug unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
